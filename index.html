<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOROSKO — pack lock</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@430;520&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#F4EFE6; color:#161616; font-family:Inter, sans-serif; }
  header, main { max-width:980px; margin:0 auto; padding:28px 20px; }
  b { font-family:Fraunces, serif; letter-spacing:.14em; }
  h1 { font-family:Fraunces, serif; font-weight:500; font-size:36px; margin:12px 0; }
  p { line-height:1.45; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  figure { margin:0; background:#fffdf8; border-radius:14px; overflow:hidden; }
  img { width:100%; display:block; }
  figcaption { padding:8px 12px; font-size:13px; }
  ul { padding-left:18px; }
</style>
</head>
<body>
<header><b>MOROSKO</b></header>
<main>
  <h1>One background. Five views.</h1>
  <p>Locked example for the cabas. Background stays Nacre #F4EFE6 on every frame. The piece does not change.</p>
  <ul>
    <li>One color per job. Default Nacre.</li>
    <li>Views: face, three-quarter, material, side, handles.</li>
    <li>Do not invent lining, hardware, or a fabric backdrop.</li>
  </ul>
  <div class="grid">
    <figure><img src="01-face.jpg" alt="Face" /><figcaption>01 Face</figcaption></figure>
    <figure><img src="02-trois-quarts.jpg" alt="Three-quarter" /><figcaption>02 Three-quarter</figcaption></figure>
    <figure><img src="03-matiere.jpg" alt="Material" /><figcaption>03 Material</figcaption></figure>
    <figure><img src="04-profil.jpg" alt="Side" /><figcaption>04 Side</figcaption></figure>
    <figure><img src="05-anses.jpg" alt="Handles" /><figcaption>05 Handles</figcaption></figure>
  </div>
</main>
</body>
</html>
